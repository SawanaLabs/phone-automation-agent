[project]
name = "customer-android-api"
version = "0.1.0"
description = "Customer Android Session-Step API for hosted phone automation"
readme = "README.md"
authors = [
    { name = "Sawana Huang", email = "130306226+waitlistSawana@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "openai>=2.41.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
customer-android-api = "customer_android_api.__main__:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Starlette TestClient imports httpx2 first on Starlette 1.2+.
    "httpx2>=2.4.0",
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
