[project]
name = "phone-automation-worker"
version = "0.1.0"
description = "FastAPI Agent Runtime for mobile phone automation tasks"
readme = "README.md"
authors = [
    { name = "Sawana Huang", email = "130306226+waitlistSawana@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "openai>=2.9.0",
    "pillow>=12.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.31.0",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
phone-automation-worker = "phone_automation_worker.__main__:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
